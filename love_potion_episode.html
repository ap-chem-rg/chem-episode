<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry of Love — An Episode Story</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b14;
    --panel: #16121f;
    --accent: #c084fc;
    --accent2: #f472b6;
    --gold: #fbbf24;
    --text: #f1e9ff;
    --muted: #a78bbb;
    --choice-bg: rgba(192,132,252,0.08);
    --choice-hover: rgba(192,132,252,0.18);
    --choice-border: rgba(192,132,252,0.3);
    --success: #34d399;
    --danger: #f87171;
    --info: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Lato', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(255,255,255,0.35) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---- TITLE SCREEN ---- */
  #title-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #0d0b14 0%, #1a0d2e 50%, #0d0b14 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.8s ease;
  }
  #title-screen.fade-out { opacity: 0; pointer-events: none; }
  .title-glow { text-align: center; margin-bottom: 2rem; }
  .title-glow h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 4rem);
    background: linear-gradient(135deg, #c084fc, #f472b6, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1.2; margin-bottom: 0.5rem;
    animation: shimmer 3s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { filter: brightness(1); } to { filter: brightness(1.3); } }
  .title-glow .subtitle { font-size: 1rem; color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase; }
  .title-glow .course-tag {
    display: inline-block; margin-top: 1rem; padding: 0.3rem 1rem;
    border: 1px solid var(--choice-border); border-radius: 20px;
    font-size: 0.75rem; color: var(--accent); letter-spacing: 0.15em;
  }
  .flask-svg { margin: 1.5rem 0; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .start-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; padding: 0.9rem 3rem; border-radius: 50px;
    font-family: 'Lato', sans-serif; font-size: 1.1rem; font-weight: 700;
    letter-spacing: 0.1em; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(192,132,252,0.4); }

  /* ---- GAME ---- */
  #game {
    position: relative; z-index: 1; width: 100%; max-width: 800px;
    min-height: 100vh; flex-direction: column; padding: 1rem; display: none;
  }
  .progress-bar-wrap {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
    margin-bottom: 1rem; background: var(--panel); border-radius: 12px;
    border: 1px solid rgba(192,132,252,0.1);
  }
  .progress-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.6s ease; }
  .progress-pct { font-size: 0.75rem; color: var(--accent); font-weight: 700; }

  /* ---- SCENE PANEL ---- */
  .scene-panel {
    background: var(--panel); border-radius: 16px;
    border: 1px solid rgba(192,132,252,0.12); overflow: hidden; margin-bottom: 1rem;
  }
  .scene-stage {
    width: 100%; height: 260px; position: relative; overflow: hidden;
  }
  .scene-stage svg { width: 100%; height: 100%; }

  .scene-location-tag {
    position: absolute; top: 12px; left: 12px;
    background: rgba(13,11,20,0.8); border: 1px solid var(--choice-border);
    padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.7rem;
    color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
    z-index: 10; pointer-events: none;
  }

  /* character slide-in */
  @keyframes char-enter-left { from { opacity:0; transform: translateX(-30px); } to { opacity:1; transform: translateX(0); } }
  @keyframes char-enter-right { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
  @keyframes char-enter-center { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .char-left  { animation: char-enter-left  0.5s ease forwards; }
  .char-right { animation: char-enter-right 0.5s ease forwards; }
  .char-center{ animation: char-enter-center 0.5s ease forwards; }

  /* idle breathing */
  @keyframes breathe { 0%,100%{transform:scaleY(1) translateY(0)} 50%{transform:scaleY(1.015) translateY(-1px)} }
  .idle { transform-origin: bottom center; animation: breathe 3s ease-in-out infinite; }

  /* item float */
  @keyframes item-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .item-float { animation: item-float 2s ease-in-out infinite; }

  /* talking mouth blink */
  @keyframes talk { 0%,100%{d:path("M-5,0 Q0,3 5,0")} 50%{d:path("M-5,0 Q0,6 5,0")} }

  /* dialogue box */
  .dialogue-box {
    padding: 1.1rem 1.4rem; border-top: 1px solid rgba(192,132,252,0.1);
    display: flex; gap: 0.85rem; align-items: flex-start;
  }
  .speaker-avatar-small {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(192,132,252,0.35); overflow: hidden; background: #1e1729;
  }
  .speaker-avatar-small svg { width: 100%; height: 100%; }
  .dialogue-inner {}
  .speaker-name {
    font-family: 'Playfair Display', serif; font-size: 0.82rem;
    color: var(--accent); font-weight: 700; letter-spacing: 0.05em; margin-bottom: 0.3rem;
  }
  .dialogue-text { font-size: 0.92rem; line-height: 1.65; color: var(--text); min-height: 2.8rem; }

  /* chem fact */
  .chem-fact {
    background: linear-gradient(135deg, rgba(192,132,252,0.08), rgba(244,114,182,0.06));
    border: 1px solid rgba(192,132,252,0.25); border-radius: 12px;
    padding: 0.8rem 1rem; margin-bottom: 0.85rem;
    display: flex; gap: 0.7rem; align-items: flex-start;
    animation: slide-in 0.4s ease;
  }
  @keyframes slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .chem-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.1rem; }
  .chem-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; margin-bottom: 0.15rem; }
  .chem-text { font-size: 0.8rem; line-height: 1.5; color: var(--muted); }
  .chem-text strong { color: var(--text); }

  /* outcome */
  .outcome-flash {
    padding: 0.55rem 0.9rem; border-radius: 8px; font-size: 0.8rem;
    margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.45rem;
    animation: slide-in 0.3s ease;
  }
  .outcome-flash.good  { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .outcome-flash.bad   { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
  .outcome-flash.neutral { background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.3); color: var(--info); }

  /* choices */
  .choices-container { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem; }
  .choice-btn {
    background: var(--choice-bg); border: 1px solid var(--choice-border); border-radius: 12px;
    padding: 0.8rem 1.1rem; color: var(--text); font-family: 'Lato', sans-serif;
    font-size: 0.88rem; text-align: left; cursor: pointer;
    transition: all 0.2s ease; display: flex; align-items: center; gap: 0.7rem; line-height: 1.4;
  }
  .choice-btn:hover { background: var(--choice-hover); border-color: var(--accent); transform: translateX(4px); }
  .choice-icon { font-size: 1.05rem; flex-shrink: 0; }
  .choice-label { font-size: 0.68rem; color: var(--muted); margin-top: 0.12rem; }

  /* items */
  .items-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
  .item-badge {
    background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
    border-radius: 20px; padding: 0.2rem 0.6rem; font-size: 0.7rem; color: var(--gold);
    display: flex; align-items: center; gap: 0.3rem;
    animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop-in { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }

  /* end screen */
  .end-screen {
    background: var(--panel); border-radius: 16px; border: 1px solid rgba(192,132,252,0.2);
    padding: 2rem; text-align: center; animation: slide-in 0.5s ease;
  }
  .end-screen h2 {
    font-family: 'Playfair Display', serif; font-size: 1.8rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 0.5rem;
  }
  .end-screen p { color: var(--muted); font-size: 0.88rem; line-height: 1.7; margin-bottom: 1rem; }
  .recipe-title { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.7rem; }
  .potion-recipe {
    background: rgba(192,132,252,0.07); border: 1px solid rgba(192,132,252,0.2);
    border-radius: 12px; padding: 1rem; text-align: left; margin-bottom: 1.5rem;
  }
  .recipe-item { display: flex; gap: 0.5rem; font-size: 0.8rem; color: var(--text); padding: 0.28rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .recipe-item:last-child { border-bottom: none; }
  .recipe-item .ri-dot { color: var(--accent); }
  .restart-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white;
    border: none; padding: 0.75rem 2.5rem; border-radius: 50px;
    font-family: 'Lato', sans-serif; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .restart-btn:hover { transform: scale(1.04); box-shadow: 0 0 20px rgba(192,132,252,0.35); }
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <div class="title-glow">
    <h1>Chemistry of Love</h1>
    <div class="subtitle">An Episode Story</div>
    <div class="course-tag">AP Chemistry · Molecular Bonds &amp; Reactions</div>
  </div>
  <svg class="flask-svg" width="80" height="100" viewBox="0 0 90 110">
    <defs>
      <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
      </linearGradient>
    </defs>
    <path d="M32 5 L32 45 L8 85 Q4 95 12 102 L78 102 Q86 95 82 85 L58 45 L58 5 Z" fill="none" stroke="rgba(192,132,252,0.5)" stroke-width="2"/>
    <path d="M32 5 L58 5" stroke="rgba(192,132,252,0.5)" stroke-width="2"/>
    <path d="M36 45 L14 82 Q11 90 18 95 L72 95 Q79 90 76 82 L54 45 Z" fill="url(#pg)" opacity="0.8"/>
    <circle cx="28" cy="75" r="4" fill="rgba(255,255,255,0.45)"/>
    <circle cx="55" cy="82" r="3" fill="rgba(255,255,255,0.35)"/>
    <circle cx="40" cy="88" r="2.5" fill="rgba(255,255,255,0.4)"/>
  </svg>
  <button class="start-btn" onclick="startGame()">Begin Story</button>
  <p style="margin-top:1.5rem;font-size:0.72rem;color:rgba(167,139,187,0.5);letter-spacing:0.05em;">Tap choices to shape your path</p>
</div>

<!-- GAME -->
<div id="game">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
    <h2 style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent);">Chemistry of Love</h2>
    <span id="chapter-label" style="font-size:0.7rem;color:var(--muted);letter-spacing:0.08em;"></span>
  </div>
  <div class="progress-bar-wrap">
    <span class="progress-label">Progress</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-pct" id="progress-pct">0%</span>
  </div>
  <div id="items-bar" class="items-bar"></div>
  <div class="scene-panel">
    <div class="scene-stage" id="scene-stage"></div>
    <div class="scene-location-tag" id="loc-tag"></div>
    <div class="dialogue-box">
      <div class="speaker-avatar-small" id="speaker-avatar-small"></div>
      <div class="dialogue-inner">
        <div class="speaker-name" id="speaker-name"></div>
        <div class="dialogue-text" id="dialogue-text"></div>
      </div>
    </div>
  </div>
  <div id="chem-fact-area"></div>
  <div id="outcome-area"></div>
  <div id="choices-area"></div>
</div>

<script>
// =====================================================================
// CHARACTER SVG BUILDERS
// Each returns an SVG <g> string positioned at (cx, groundY)
// Characters are ~110px tall standing figures, Episode-visual-novel style
// =====================================================================

// Skin tones and outfit palettes per character
const CHARS = {
  player: { skin:'#F4C5A0', hair:'#3B2314', outfit:'#6d28d9', outline:'#4c1d95' },
  vela:   { skin:'#C68642', hair:'#1a0a00', outfit:'#1e3a5f', outline:'#0c2340' },
  park:   { skin:'#EFC89F', hair:'#5c2d0a', outfit:'#be185d', outline:'#9d174d' },
  chen:   { skin:'#D4956A', hair:'#2d1a00', outfit:'#065f46', outline:'#064e3b' },
  rivera: { skin:'#A0785A', hair:'#120800', outfit:'#1e3a8a', outline:'#1e3a8a' },
};

function buildChar(key, cx, groundY, facing='right', holdItem=null, classNames='') {
  const c = CHARS[key];
  const flip = facing === 'left' ? `scale(-1,1) translate(-${cx*2},0)` : '';
  const gy = groundY; // feet Y
  // body proportions (all relative to groundY)
  const h = 115; // total height
  const headR = 16;
  const neckH = 6;
  const torsoH = 38;
  const legH = 40;
  const footH = 8;
  const armH = 32;

  const headCY = gy - legH - footH - torsoH - neckH - headR;
  const neckY  = gy - legH - footH - torsoH - neckH;
  const torsoY = gy - legH - footH - torsoH;
  const hipY   = gy - legH - footH;
  const kneeY  = gy - footH - legH/2;
  const footY  = gy - footH;

  // shoulder Y for arms
  const shoulderY = torsoY + 6;
  const elbowY = shoulderY + armH * 0.5;
  const handY = shoulderY + armH;

  // outfit detail: collar line
  const collarY = torsoY + 8;

  let itemSvg = '';
  if (holdItem === 'flask') {
    itemSvg = `
      <g class="item-float" transform="translate(${cx+18}, ${handY - 22})">
        <rect x="-8" y="0" width="16" height="20" rx="2" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
        <rect x="-6" y="20" width="12" height="8" rx="1" fill="#7c3aed" opacity="0.6"/>
        <rect x="-3" y="-5" width="6" height="6" rx="1" fill="#8b5cf6"/>
        <circle cx="0" cy="10" r="4" fill="rgba(255,255,255,0.3)"/>
      </g>`;
  } else if (holdItem === 'book') {
    itemSvg = `
      <g class="item-float" transform="translate(${cx+18}, ${handY - 14})">
        <rect x="-12" y="-10" width="24" height="20" rx="2" fill="#065f46" stroke="#064e3b" stroke-width="1.5"/>
        <line x1="-12" y1="0" x2="12" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
        <rect x="-4" y="-7" width="8" height="14" rx="1" fill="rgba(255,255,255,0.15)"/>
      </g>`;
  } else if (holdItem === 'vial') {
    itemSvg = `
      <g class="item-float" transform="translate(${cx+16}, ${handY - 18})">
        <rect x="-4" y="0" width="8" height="18" rx="3" fill="#f472b6" stroke="#be185d" stroke-width="1.2"/>
        <rect x="-2" y="-4" width="4" height="5" fill="#be185d" rx="1"/>
        <circle cx="0" cy="9" r="2.5" fill="rgba(255,255,255,0.35)"/>
      </g>`;
  } else if (holdItem === 'stethoscope') {
    itemSvg = `
      <g transform="translate(${cx+14}, ${shoulderY+6})">
        <path d="M0,0 Q10,12 6,22" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
        <circle cx="6" cy="22" r="5" fill="none" stroke="#6b7280" stroke-width="1.5"/>
        <circle cx="6" cy="22" r="2" fill="#9ca3af"/>
      </g>`;
  }

  return `
<g class="${classNames}" transform="${flip}">
  <g class="idle" transform="translate(0,0)">
    <!-- shadow -->
    <ellipse cx="${cx}" cy="${gy+2}" rx="18" ry="4" fill="rgba(0,0,0,0.25)"/>
    <!-- legs -->
    <rect x="${cx-10}" y="${hipY}" width="9" height="${legH+footH}" rx="4" fill="${c.outfit}"/>
    <rect x="${cx+1}" y="${hipY}" width="9" height="${legH+footH}" rx="4" fill="${c.outfit}"/>
    <!-- feet -->
    <ellipse cx="${cx-6}" cy="${gy}" rx="8" ry="${footH/2}" fill="${c.outline}"/>
    <ellipse cx="${cx+6}" cy="${gy}" rx="8" ry="${footH/2}" fill="${c.outline}"/>
    <!-- torso -->
    <rect x="${cx-13}" y="${torsoY}" width="26" height="${torsoH+neckH}" rx="5" fill="${c.outfit}"/>
    <!-- collar detail -->
    <path d="M${cx-4},${collarY} L${cx},${collarY+8} L${cx+4},${collarY}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <!-- left arm (back) -->
    <line x1="${cx-13}" y1="${shoulderY}" x2="${cx-18}" y2="${handY}" stroke="${c.outfit}" stroke-width="9" stroke-linecap="round"/>
    <!-- right arm (front) -->
    <line x1="${cx+13}" y1="${shoulderY}" x2="${cx+17}" y2="${handY}" stroke="${c.outline}" stroke-width="9" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="${cx-5}" y="${neckY}" width="10" height="${neckH+3}" fill="${c.skin}"/>
    <!-- head -->
    <ellipse cx="${cx}" cy="${headCY}" rx="${headR}" ry="${headR+1}" fill="${c.skin}" stroke="${c.outline}" stroke-width="1.2"/>
    <!-- hair -->
    <ellipse cx="${cx}" cy="${headCY - headR*0.55}" rx="${headR+1}" ry="${headR*0.65}" fill="${c.hair}"/>
    <!-- eyes -->
    <circle cx="${cx-5}" cy="${headCY+1}" r="2.2" fill="#fff"/>
    <circle cx="${cx+5}" cy="${headCY+1}" r="2.2" fill="#fff"/>
    <circle cx="${cx-4.5}" cy="${headCY+1.5}" r="1.4" fill="${c.outline}"/>
    <circle cx="${cx+5.5}" cy="${headCY+1.5}" r="1.4" fill="${c.outline}"/>
    <!-- eyebrows -->
    <path d="M${cx-7},${headCY-4} Q${cx-4.5},${headCY-6} ${cx-2},${headCY-4}" fill="none" stroke="${c.hair}" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M${cx+2},${headCY-4} Q${cx+4.5},${headCY-6} ${cx+7},${headCY-4}" fill="none" stroke="${c.hair}" stroke-width="1.2" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M${cx-4},${headCY+8} Q${cx},${headCY+11} ${cx+4},${headCY+8}" fill="none" stroke="${c.outline}" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  ${itemSvg}
</g>`;
}

// Mini portrait for dialogue box (just head + shoulders)
function buildPortrait(key, color) {
  const c = CHARS[key];
  return `<svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
    <rect width="42" height="42" fill="${color || '#1e1729'}"/>
    <rect x="14" y="28" width="14" height="14" fill="${c.outfit}"/>
    <rect x="17" y="24" width="8" height="7" fill="${c.skin}"/>
    <ellipse cx="21" cy="18" rx="10" ry="11" fill="${c.skin}"/>
    <ellipse cx="21" cy="10" rx="11" ry="7" fill="${c.hair}"/>
    <circle cx="17" cy="19" r="1.8" fill="#fff"/>
    <circle cx="25" cy="19" r="1.8" fill="#fff"/>
    <circle cx="17.5" cy="19.5" r="1.1" fill="${c.outline}"/>
    <circle cx="25.5" cy="19.5" r="1.1" fill="${c.outline}"/>
    <path d="M17,25 Q21,28 25,25" fill="none" stroke="${c.outline}" stroke-width="1" stroke-linecap="round"/>
  </svg>`;
}

// =====================================================================
// GAME STATE + ENGINE
// =====================================================================
let state = { sceneId:0, items:[], history:[] };
const TOTAL = 11;

function startGame() {
  document.getElementById('title-screen').classList.add('fade-out');
  const g = document.getElementById('game');
  g.style.display = 'flex';
  g.style.flexDirection = 'column';
  setTimeout(() => document.getElementById('title-screen').style.display='none', 800);
  renderScene(0);
}

function renderScene(id) {
  state.sceneId = id;
  state.history.push(id);
  const s = SCENES[id];

  document.getElementById('chapter-label').textContent = s.chapter;

  const pct = Math.round((id / TOTAL) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';

  // Build scene SVG
  const bgFn = BKGS[s.bg] || (() => '');
  const chars = SCENE_CHARS[id] || [];
  const charsSvg = chars.map(c => buildChar(c.key, c.cx, c.ground, c.facing, c.hold, c.cls)).join('');
  const stageSvg = `<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;">
    ${bgFn()}
    ${charsSvg}
  </svg>`;

  document.getElementById('scene-stage').innerHTML = stageSvg;
  document.getElementById('loc-tag').textContent = s.location;

  // Speaker portrait
  const speakerKey = SPEAKER_CHAR[s.speaker] || 'player';
  const bgColors = { vela:'#0c1f35', park:'#2d0a1a', chen:'#041f13', rivera:'#0d1520', player:'#1a0d2e' };
  document.getElementById('speaker-avatar-small').innerHTML = buildPortrait(speakerKey, bgColors[speakerKey]);
  document.getElementById('speaker-name').textContent = s.speaker;
  document.getElementById('dialogue-text').textContent = '';
  typeText('dialogue-text', s.dialogue);

  if (s.item)  addItem(s.item);
  if (s.item2) addItem(s.item2);
  renderItems();

  // Chem fact
  const ca = document.getElementById('chem-fact-area');
  ca.innerHTML = s.chemFact ? `<div class="chem-fact">
    <span class="chem-icon">${s.chemFact.icon}</span>
    <div>
      <div class="chem-label">🔬 ${s.chemFact.label}</div>
      <div class="chem-text">${s.chemFact.text}</div>
    </div>
  </div>` : '';

  // Outcome
  const oa = document.getElementById('outcome-area');
  oa.innerHTML = s.outcome ? `<div class="outcome-flash ${s.outcome.type}">${s.outcome.text}</div>` : '';

  // Choices
  const qa = document.getElementById('choices-area');
  qa.innerHTML = '';
  if (s.isEnd) { renderEnd(s); return; }

  setTimeout(() => {
    const box = document.createElement('div');
    box.className = 'choices-container';
    s.choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-icon">${ch.icon}</span><div><div class="choice-text">${ch.text}</div><div class="choice-label">${ch.label}</div></div>`;
      btn.onclick = () => {
        box.querySelectorAll('.choice-btn').forEach(b => b.disabled=true);
        btn.style.borderColor='var(--accent)';
        btn.style.background='rgba(192,132,252,0.2)';
        setTimeout(() => renderScene(ch.next), 480);
      };
      box.appendChild(btn);
    });
    qa.appendChild(box);
  }, 380);
}

function renderEnd(s) {
  const qa = document.getElementById('choices-area');
  const ok = s.endType === 'complete';
  const recipe = ok ? `<div class="potion-recipe">
    <div class="recipe-title">Final Love Potion Recipe</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Phenylethylamine (PEA) — C₈H₁₁N — dopamine trigger</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Theobromine — C₇H₈N₄O₂ — mood elevator</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Rhodiola rosea extract — serotonin regulator</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Linalool (Lavender) — GABA receptor calmer</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Vanillin — C₈H₈O₃ — dopaminergic boost</div>
    <div class="recipe-item"><span class="ri-dot">▸</span> Mix at pH 7.4 in aqueous solution at 37°C</div>
  </div>` : '';
  qa.innerHTML = `<div class="end-screen">
    <div style="font-size:3rem;margin-bottom:1rem;">${ok?'💗':'🧪'}</div>
    <h2>${ok?'Love Potion Complete!':'Quest Incomplete'}</h2>
    <p>${ok
      ? 'You made every right choice. All five neurochemical ingredients combined — a beautiful example of how chemistry underlies human emotion.'
      : 'Your potion is missing a key ingredient. The best chemists learn from incomplete reactions. Try again and make different choices!'
    }</p>
    ${recipe}
    <button class="restart-btn" onclick="restartGame()">↺ Play Again</button>
  </div>`;
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('progress-pct').textContent='100%';
}

function addItem(item) { if (!state.items.includes(item)) state.items.push(item); }

function renderItems() {
  document.getElementById('items-bar').innerHTML =
    state.items.map(i => `<div class="item-badge">${i}</div>`).join('');
}

function typeText(id, text) {
  const el = document.getElementById(id);
  el.textContent = '';
  let i = 0;
  (function tick() { if (i < text.length) { el.textContent += text[i++]; setTimeout(tick, 20); } })();
}

function restartGame() {
  state = { sceneId:0, items:[], history:[] };
  document.getElementById('items-bar').innerHTML='';
  renderScene(0);
}
</script>
