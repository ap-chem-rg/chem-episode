<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Makes People Fall in Love? Chem Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0b14; --panel:#16121f; --panel2:#1e1729;
  --accent:#c084fc; --accent2:#f472b6; --gold:#fbbf24;
  --text:#f1e9ff; --muted:#a78bbb;
  --cbg:rgba(192,132,252,0.08); --chov:rgba(192,132,252,0.18); --cbor:rgba(192,132,252,0.3);
  --ok:#34d399; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Lato',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 50% 25%,rgba(255,255,255,0.45) 0%,transparent 100%),radial-gradient(1px 1px at 70% 75%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 85% 20%,rgba(255,255,255,0.35) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 90% 60%,rgba(255,255,255,0.3) 0%,transparent 100%);pointer-events:none;z-index:0;}

/* === TITLE SCREEN === */
#title-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0d0b14 0%,#1a0d2e 50%,#0d0b14 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.8s ease;}
#title-screen.fade-out{opacity:0;pointer-events:none;}
.title-glow{text-align:center;margin-bottom:1.5rem;}
.title-glow h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,3.5rem);background:linear-gradient(135deg,#c084fc,#f472b6,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;margin-bottom:0.4rem;animation:shimmer 3s ease-in-out infinite alternate;}
@keyframes shimmer{from{filter:brightness(1);}to{filter:brightness(1.3);}}
.title-glow .subtitle{font-size:0.85rem;color:var(--muted);letter-spacing:0.25em;text-transform:uppercase;}
.title-glow .course-tag{display:inline-block;margin-top:0.8rem;padding:0.25rem 0.9rem;border:1px solid var(--cbor);border-radius:20px;font-size:0.72rem;color:var(--accent);letter-spacing:0.12em;}
.flask-anim{margin:1rem 0;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:0.85rem 2.5rem;border-radius:50px;font-family:'Lato',sans-serif;font-size:1rem;font-weight:700;letter-spacing:0.1em;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;text-transform:uppercase;}
.start-btn:hover{transform:scale(1.05);box-shadow:0 0 28px rgba(192,132,252,0.45);}

/* === CHARACTER SELECT === */
#char-select{position:fixed;inset:0;background:linear-gradient(160deg,#0d0b14 0%,#1a0d2e 50%,#0d0b14 100%);display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:2rem 1rem 1rem;z-index:99;overflow-y:auto;}
#char-select h2{font-family:'Playfair Display',serif;font-size:1.8rem;background:linear-gradient(135deg,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.4rem;text-align:center;}
#char-select p{color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem;text-align:center;}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.85rem;width:100%;max-width:780px;margin-bottom:1.5rem;}
.char-card{background:var(--panel);border:2px solid rgba(192,132,252,0.15);border-radius:14px;padding:0.85rem 0.5rem;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:0.5rem;}
.char-card:hover{border-color:var(--accent);background:rgba(192,132,252,0.1);transform:translateY(-2px);}
.char-card.selected{border-color:var(--accent2);background:rgba(244,114,182,0.12);box-shadow:0 0 16px rgba(244,114,182,0.2);}
.char-card svg{width:70px;height:90px;}
.char-card .char-cname{font-family:'Playfair Display',serif;font-size:0.85rem;color:var(--text);text-align:center;}
.confirm-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:0.8rem 2.5rem;border-radius:50px;font-family:'Lato',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;text-transform:uppercase;letter-spacing:0.08em;opacity:0.4;pointer-events:none;}
.confirm-btn.active{opacity:1;pointer-events:auto;}
.confirm-btn.active:hover{transform:scale(1.04);box-shadow:0 0 20px rgba(192,132,252,0.4);}

/* === GAME === */
#game{position:relative;z-index:1;width:100%;max-width:800px;min-height:100vh;flex-direction:column;padding:1rem;display:none;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;}
.top-bar h2{font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--accent);}
.chapter-label{font-size:0.68rem;color:var(--muted);letter-spacing:0.08em;}
.progress-bar-wrap{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 0.9rem;margin-bottom:0.85rem;background:var(--panel);border-radius:12px;border:1px solid rgba(192,132,252,0.1);}
.progress-label{font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}
.progress-track{flex:1;height:5px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width 0.6s ease;}
.progress-pct{font-size:0.72rem;color:var(--accent);font-weight:700;}

/* scene panel */
.scene-panel{background:var(--panel);border-radius:16px;border:1px solid rgba(192,132,252,0.12);overflow:hidden;margin-bottom:0.85rem;position:relative;}
.scene-stage{width:100%;height:250px;position:relative;overflow:hidden;}
.loc-tag{position:absolute;top:10px;left:10px;background:rgba(13,11,20,0.82);border:1px solid var(--cbor);padding:0.25rem 0.7rem;border-radius:20px;font-size:0.67rem;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;z-index:10;pointer-events:none;}
.dialogue-box{padding:1rem 1.25rem;border-top:1px solid rgba(192,132,252,0.1);display:flex;gap:0.8rem;align-items:flex-start;}
.spk-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;border:2px solid rgba(192,132,252,0.35);overflow:hidden;background:#1e1729;}
.spk-avatar svg{width:100%;height:100%;}
.dialogue-inner{}
.spk-name{font-family:'Playfair Display',serif;font-size:0.8rem;color:var(--accent);font-weight:700;letter-spacing:0.05em;margin-bottom:0.25rem;}
.dlg-text{font-size:0.9rem;line-height:1.65;color:var(--text);min-height:2.6rem;}

/* answer box */
.answer-box{background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:0.75rem 1rem;margin-bottom:0.8rem;animation:slide-in 0.4s ease;}
.answer-label{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:700;margin-bottom:0.2rem;}
.answer-text{font-size:0.82rem;line-height:1.5;color:var(--text);}

/* chem fact */
.chem-fact{background:linear-gradient(135deg,rgba(192,132,252,0.08),rgba(244,114,182,0.05));border:1px solid rgba(192,132,252,0.22);border-radius:12px;padding:0.75rem 0.9rem;margin-bottom:0.8rem;display:flex;gap:0.65rem;align-items:flex-start;animation:slide-in 0.4s ease;}
@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chem-icon{font-size:1.1rem;flex-shrink:0;margin-top:0.1rem;}
.chem-label{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent);font-weight:700;margin-bottom:0.12rem;}
.chem-text{font-size:0.78rem;line-height:1.5;color:var(--muted);}
.chem-text strong{color:var(--text);}

/* outcome */
.outcome-flash{padding:0.5rem 0.85rem;border-radius:8px;font-size:0.78rem;margin-bottom:0.65rem;display:flex;align-items:center;gap:0.4rem;animation:slide-in 0.3s ease;}
.outcome-flash.good{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.28);color:var(--ok);}
.outcome-flash.bad{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.28);color:var(--bad);}
.outcome-flash.neutral{background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.28);color:var(--info);}

/* choices */
.choices-container{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.85rem;}
.choice-btn{background:var(--cbg);border:1px solid var(--cbor);border-radius:12px;padding:0.75rem 1.05rem;color:var(--text);font-family:'Lato',sans-serif;font-size:0.87rem;text-align:left;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;gap:0.65rem;line-height:1.4;}
.choice-btn:hover{background:var(--chov);border-color:var(--accent);transform:translateX(4px);}
.choice-icon{font-size:1rem;flex-shrink:0;}
.choice-sub{font-size:0.67rem;color:var(--muted);margin-top:0.1rem;}

/* items bar */
.items-bar{display:flex;gap:0.45rem;flex-wrap:wrap;margin-bottom:0.8rem;min-height:0;}
.item-badge{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.28);border-radius:20px;padding:0.18rem 0.6rem;font-size:0.68rem;color:var(--gold);display:flex;align-items:center;gap:0.25rem;animation:pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes pop-in{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}

/* end screen */
.end-screen{background:var(--panel);border-radius:16px;border:1px solid rgba(192,132,252,0.2);padding:1.75rem;text-align:center;animation:slide-in 0.5s ease;}
.end-screen h2{font-family:'Playfair Display',serif;font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem;}
.end-screen p{color:var(--muted);font-size:0.85rem;line-height:1.7;margin-bottom:0.9rem;}
.end-facts{background:rgba(192,132,252,0.07);border:1px solid rgba(192,132,252,0.18);border-radius:12px;padding:0.9rem;text-align:left;margin-bottom:1.25rem;}
.end-fact-item{display:flex;gap:0.5rem;font-size:0.78rem;color:var(--text);padding:0.25rem 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.end-fact-item:last-child{border-bottom:none;}
.end-fact-item .dot{color:var(--accent);}
.reset-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:0.72rem 2.2rem;border-radius:50px;font-family:'Lato',sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;text-transform:uppercase;letter-spacing:0.08em;}
.reset-btn:hover{transform:scale(1.04);box-shadow:0 0 18px rgba(192,132,252,0.35);}

/* character animations */
@keyframes char-left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
@keyframes char-right{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes char-center{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.cl{animation:char-left 0.5s ease forwards;}
.cr{animation:char-right 0.5s ease forwards;}
.cc{animation:char-center 0.5s ease forwards;}
@keyframes breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(1.015) translateY(-1px)}}
.idle{transform-origin:bottom center;animation:breathe 3.2s ease-in-out infinite;}
@keyframes ifloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ifloat{animation:ifloat 2s ease-in-out infinite;}
</style>
</head>
<body>

<!-- TITLE -->
<div id="title-screen">
  <div class="title-glow">
    <h1>What Makes People<br>Fall in Love?</h1>
    <div class="subtitle">A Chemistry Hunt</div>
    <div class="course-tag">AP Chemistry · Greenwich High School</div>
  </div>
  <svg class="flask-anim" width="72" height="92" viewBox="0 0 90 110">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/></linearGradient></defs>
    <path d="M32 5 L32 45 L8 85 Q4 95 12 102 L78 102 Q86 95 82 85 L58 45 L58 5 Z" fill="none" stroke="rgba(192,132,252,0.5)" stroke-width="2"/>
    <path d="M32 5 L58 5" stroke="rgba(192,132,252,0.5)" stroke-width="2"/>
    <path d="M36 45 L14 82 Q11 90 18 95 L72 95 Q79 90 76 82 L54 45 Z" fill="url(#pg)" opacity="0.8"/>
    <circle cx="28" cy="74" r="4" fill="rgba(255,255,255,0.4)"/><circle cx="54" cy="82" r="3" fill="rgba(255,255,255,0.35)"/><circle cx="40" cy="88" r="2.5" fill="rgba(255,255,255,0.4)"/>
  </svg>
  <button class="start-btn" onclick="goToCharSelect()">Choose Your Character</button>
  <p style="margin-top:1.2rem;font-size:0.7rem;color:rgba(167,139,187,0.45);letter-spacing:0.05em;">Make choices · Discover the chemistry of love</p>
</div>

<!-- CHARACTER SELECT -->
<div id="char-select">
  <h2>Who Are You?</h2>
  <p>Choose your character to begin the hunt</p>
  <div class="char-grid" id="char-grid"></div>
  <button class="confirm-btn" id="confirm-btn" onclick="confirmChar()">Let's Go ✦</button>
</div>

<!-- GAME -->
<div id="game">
  <div class="top-bar">
    <h2>Chemistry Hunt</h2>
    <span class="chapter-label" id="chapter-label"></span>
  </div>
  <div class="progress-bar-wrap">
    <span class="progress-label">Progress</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-pct" id="progress-pct">0%</span>
  </div>
  <div class="items-bar" id="items-bar"></div>
  <div class="scene-panel">
    <div class="scene-stage" id="scene-stage"></div>
    <div class="loc-tag" id="loc-tag"></div>
    <div class="dialogue-box">
      <div class="spk-avatar" id="spk-avatar"></div>
      <div class="dialogue-inner">
        <div class="spk-name" id="spk-name"></div>
        <div class="dlg-text" id="dlg-text"></div>
      </div>
    </div>
  </div>
  <div id="answer-area"></div>
  <div id="chem-area"></div>
  <div id="outcome-area"></div>
  <div id="choices-area"></div>
</div>

<script>
// ============================================================
// PLAYABLE CHARACTERS
// ============================================================
const PLAYABLE = [
  { id:'hannah', name:'Hannah', desc:'Blonde, straight hair', hair:'#F5E28C', skin:'#F5D5B8', outfit:'#6d28d9', hairStyle:'straight-long', glasses:false, curly:false },
  { id:'addy',   name:'Addy',   desc:'Straight black hair', hair:'#1a1a1a', skin:'#F0D0B5', outfit:'#be185d', hairStyle:'straight-long', glasses:false, curly:false },
  { id:'charlie',name:'Charlie',desc:'Asian, glasses',       hair:'#111111', skin:'#E8C99A', outfit:'#1d4ed8', hairStyle:'short',        glasses:true,  curly:false },
  { id:'yihan',  name:'Yihan',  desc:'Asian, black hair',    hair:'#111111', skin:'#E8C89A', outfit:'#065f46', hairStyle:'straight-med',  glasses:false, curly:false },
  { id:'niko',   name:'Niko',   desc:'Curly brown hair',     hair:'#7B4A2D', skin:'#F2D0B0', outfit:'#92400e', hairStyle:'curly-short',   glasses:false, curly:true  },
  { id:'sophia', name:'Sophia', desc:'Curly long brown hair',hair:'#7B4A2D', skin:'#F2D0B0', outfit:'#9d174d', hairStyle:'curly-long',    glasses:false, curly:true  },
  { id:'vihaan', name:'Vihaan', desc:'Indian, black hair',   hair:'#0f0f0f', skin:'#C9935A', outfit:'#1e3a5f', hairStyle:'short',        glasses:false, curly:false },
  { id:'alexa',  name:'Alexa',  desc:'Brown straight hair',  hair:'#5C3A1E', skin:'#F2D0B0', outfit:'#7c3aed', hairStyle:'straight-med',  glasses:false, curly:false },
  { id:'zain',   name:'Zain',   desc:'Curly black hair, tan',hair:'#111111', skin:'#C9935A', outfit:'#064e3b', hairStyle:'curly-short',   glasses:false, curly:true  },
  { id:'benny',  name:'Benny',  desc:'Brown hair, easygoing',hair:'#7B4A2D', skin:'#F5D5B8', outfit:'#1e3a5f', hairStyle:'short',        glasses:false, curly:false },
];

// NPC characters
const NPCS = {
  vogel:  { name:'Mrs. Vogel', skin:'#F5D5C0', hair:'#6ec6f5', outfit:'#4a3f6b', hairStyle:'straight-med', glasses:true,  curly:false },
  mayo:   { name:'Mr. Mayo',   skin:'#F5D5C0', hair:'#d4d4d4', outfit:'#374151', hairStyle:'short',        glasses:false, curly:false },
  rachel: { name:'Rachel',     skin:'#F2D0B0', hair:'#5C3A1E', outfit:'#be185d', hairStyle:'straight-long',glasses:false, curly:false },
  karolina:{ name:'Karolina', skin:'#F5E0D0', hair:'#F5E28C', outfit:'#1d4ed8', hairStyle:'straight-long',glasses:false, curly:false },
};

// ============================================================
// SVG CHARACTER BUILDER
// ============================================================
function buildChar(cfg, cx, groundY, facing, holdItem, animCls) {
  const c = cfg;
  const flip = facing === 'left' ? `scale(-1,1) translate(${-cx*2},0)` : '';
  const gy = groundY;
  const headR = 15, neckH = 5, torsoH = 36, legH = 38, footH = 7, armH = 30;
  const headCY = gy - legH - footH - torsoH - neckH - headR;
  const neckY  = gy - legH - footH - torsoH - neckH;
  const torsoY = gy - legH - footH - torsoH;
  const hipY   = gy - legH - footH;
  const shoulderY = torsoY + 5;
  const handY  = shoulderY + armH;

  // hair svg
  let hairSvg = '';
  const hs = c.hairStyle;
  if (hs === 'straight-long') {
    hairSvg = `<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+1}" ry="${headR*0.7}" fill="${c.hair}"/>
    <rect x="${cx-headR+2}" y="${headCY}" width="5" height="28" rx="2" fill="${c.hair}" opacity="0.9"/>
    <rect x="${cx+headR-7}" y="${headCY}" width="5" height="28" rx="2" fill="${c.hair}" opacity="0.9"/>`;
  } else if (hs === 'straight-med') {
    hairSvg = `<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+1}" ry="${headR*0.7}" fill="${c.hair}"/>
    <rect x="${cx-headR+2}" y="${headCY}" width="5" height="14" rx="2" fill="${c.hair}" opacity="0.9"/>
    <rect x="${cx+headR-7}" y="${headCY}" width="5" height="14" rx="2" fill="${c.hair}" opacity="0.9"/>`;
  } else if (hs === 'curly-long') {
    hairSvg = `<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+3}" ry="${headR*0.85}" fill="${c.hair}"/>
    <circle cx="${cx-headR+1}" cy="${headCY+8}" r="5" fill="${c.hair}"/>
    <circle cx="${cx+headR-1}" cy="${headCY+8}" r="5" fill="${c.hair}"/>
    <circle cx="${cx-headR}" cy="${headCY+18}" r="5" fill="${c.hair}"/>
    <circle cx="${cx+headR}" cy="${headCY+18}" r="5" fill="${c.hair}"/>`;
  } else if (hs === 'curly-short') {
    hairSvg = `<ellipse cx="${cx}" cy="${headCY-headR*0.55}" rx="${headR+3}" ry="${headR*0.8}" fill="${c.hair}"/>
    <circle cx="${cx-headR+2}" cy="${headCY+2}" r="4" fill="${c.hair}"/>
    <circle cx="${cx+headR-2}" cy="${headCY+2}" r="4" fill="${c.hair}"/>`;
  } else { // short
    hairSvg = `<ellipse cx="${cx}" cy="${headCY-headR*0.6}" rx="${headR+1}" ry="${headR*0.65}" fill="${c.hair}"/>`;
  }

  // glasses
  const glassesSvg = c.glasses ? `
    <circle cx="${cx-5}" cy="${headCY+1}" r="3.5" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <circle cx="${cx+5}" cy="${headCY+1}" r="3.5" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
    <line x1="${cx-1.5}" y1="${headCY+1}" x2="${cx+1.5}" y2="${headCY+1}" stroke="#9ca3af" stroke-width="0.9"/>
    <line x1="${cx-8.5}" y1="${headCY+1}" x2="${cx-10}" y2="${headCY+1}" stroke="#9ca3af" stroke-width="0.9"/>
    <line x1="${cx+8.5}" y1="${headCY+1}" x2="${cx+10}" y2="${headCY+1}" stroke="#9ca3af" stroke-width="0.9"/>` : '';

  // held item
  let itemSvg = '';
  if (holdItem === 'flask') {

function buildPortrait(cfg, bg) {
  const c = cfg;
  const cx=21, headCY=17, headR=10;
  let hairSvg = '';
  const hs = c.hairStyle;
  if (hs==='straight-long'||hs==='straight-med') {
    hairSvg=`<ellipse cx="${cx}" cy="${headCY-6}" rx="11" ry="7" fill="${c.hair}"/>
    <rect x="${cx-9}" y="${headCY}" width="4" height="${hs==='straight-long'?16:9}" rx="2" fill="${c.hair}"/>
    <rect x="${cx+5}" y="${headCY}" width="4" height="${hs==='straight-long'?16:9}" rx="2" fill="${c.hair}"/>`;
  } else if (hs==='curly-long'||hs==='curly-short') {
    hairSvg=`<ellipse cx="${cx}" cy="${headCY-6}" rx="13" ry="8" fill="${c.hair}"/>
    <circle cx="${cx-9}" cy="${headCY+3}" r="4" fill="${c.hair}"/>
    <circle cx="${cx+9}" cy="${headCY+3}" r="4" fill="${c.hair}"/>
    ${hs==='curly-long'?`<circle cx="${cx-9}" cy="${headCY+11}" r="4" fill="${c.hair}"/><circle cx="${cx+9}" cy="${headCY+11}" r="4" fill="${c.hair}"/>`:''}`;
  } else {
    hairSvg=`<ellipse cx="${cx}" cy="${headCY-6}" rx="11" ry="6.5" fill="${c.hair}"/>`;
  }
  const glSvg = c.glasses ? `<circle cx="${cx-4}" cy="${headCY+1}" r="3" fill="none" stroke="#9ca3af" stroke-width="1"/><circle cx="${cx+4}" cy="${headCY+1}" r="3" fill="none" stroke="#9ca3af" stroke-width="1"/><line x1="${cx-1}" y1="${headCY+1}" x2="${cx+1}" y2="${headCY+1}" stroke="#9ca3af" stroke-width="0.8"/>` : '';
  return `<svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
    <rect width="42" height="42" fill="${bg||'#1e1729'}"/>
    <rect x="12" y="26" width="18" height="16" fill="${c.outfit}"/>
    <rect x="16" y="22" width="10" height="7" fill="${c.skin}"/>
    <ellipse cx="${cx}" cy="${headCY}" rx="${headR}" ry="${headR+1}" fill="${c.skin}"/>
    ${hairSvg}
    <circle cx="${cx-4}" cy="${headCY+1}" r="1.6" fill="#fff"/>
    <circle cx="${cx+4}" cy="${headCY+1}" r="1.6" fill="#fff"/>
    <circle cx="${cx-3.5}" cy="${headCY+1.4}" r="1" fill="#1a0d2e"/>
    <circle cx="${cx+4.5}" cy="${headCY+1.4}" r="1" fill="#1a0d2e"/>
    <path d="M${cx-3},${headCY+8} Q${cx},${headCY+11} ${cx+3},${headCY+8}" fill="none" stroke="#1a0d2e" stroke-width="1" stroke-linecap="round"/>
    ${glSvg}
  </svg>`;
}

function goToCharSelect() {
  document.getElementById('title-screen').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('title-screen').style.display='none';
    const cs = document.getElementById('char-select');
    cs.style.display='flex';
    buildCharGrid();
  }, 700);
}

function buildCharGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  PLAYABLE.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.dataset.id = ch.id;
    // mini preview SVG
    const svgStr = buildCharPreview(ch);
    card.innerHTML = `${svgStr}<div class="char-cname">${ch.name}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      state.selectedChar = ch;
      const btn = document.getElementById('confirm-btn');
      btn.classList.add('active');
    };
    grid.appendChild(card);
  });
}

function buildCharPreview(ch) {
  const cx=35, gy=82;
  const headR=12, neckH=4, torsoH=28, legH=28, footH=6, armH=22;
  const headCY = gy-legH-footH-torsoH-neckH-headR;
  const torsoY = gy-legH-footH-torsoH;
  const hipY = gy-legH-footH;
  const shoulderY = torsoY+4;
  const handY = shoulderY+armH;
  const neckY = gy-legH-footH-torsoH-neckH;
  let hairSvg='';
  const hs=ch.hairStyle;
  if(hs==='straight-long'){hairSvg=`<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+1}" ry="${headR*0.7}" fill="${ch.hair}"/><rect x="${cx-headR+2}" y="${headCY}" width="4" height="22" rx="2" fill="${ch.hair}"/><rect x="${cx+headR-6}" y="${headCY}" width="4" height="22" rx="2" fill="${ch.hair}"/>`;}
  else if(hs==='straight-med'){hairSvg=`<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+1}" ry="${headR*0.7}" fill="${ch.hair}"/><rect x="${cx-headR+2}" y="${headCY}" width="4" height="12" rx="2" fill="${ch.hair}"/><rect x="${cx+headR-6}" y="${headCY}" width="4" height="12" rx="2" fill="${ch.hair}"/>`;}
  else if(hs==='curly-long'){hairSvg=`<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+3}" ry="${headR*0.85}" fill="${ch.hair}"/><circle cx="${cx-headR+1}" cy="${headCY+6}" r="4" fill="${ch.hair}"/><circle cx="${cx+headR-1}" cy="${headCY+6}" r="4" fill="${ch.hair}"/><circle cx="${cx-headR}" cy="${headCY+14}" r="4" fill="${ch.hair}"/><circle cx="${cx+headR}" cy="${headCY+14}" r="4" fill="${ch.hair}"/>`;}
  else if(hs==='curly-short'){hairSvg=`<ellipse cx="${cx}" cy="${headCY-headR*0.5}" rx="${headR+3}" ry="${headR*0.78}" fill="${ch.hair}"/><circle cx="${cx-headR+2}" cy="${headCY+2}" r="3.5" fill="${ch.hair}"/><circle cx="${cx+headR-2}" cy="${headCY+2}" r="3.5" fill="${ch.hair}"/>`;}
  else{hairSvg=`<ellipse cx="${cx}" cy="${headCY-headR*0.58}" rx="${headR+1}" ry="${headR*0.62}" fill="${ch.hair}"/>`;}
  const glSvg = ch.glasses ? `<circle cx="${cx-4}" cy="${headCY+1}" r="2.8" fill="none" stroke="#9ca3af" stroke-width="1"/><circle cx="${cx+4}" cy="${headCY+1}" r="2.8" fill="none" stroke="#9ca3af" stroke-width="1"/><line x1="${cx-1.2}" y1="${headCY+1}" x2="${cx+1.2}" y2="${headCY+1}" stroke="#9ca3af" stroke-width="0.8"/>` : '';
  return `<svg viewBox="0 0 70 90" xmlns="http://www.w3.org/2000/svg" width="70" height="90">
    <ellipse cx="${cx}" cy="${gy+1}" rx="13" ry="3" fill="rgba(0,0,0,0.2)"/>
    <rect x="${cx-8}" y="${hipY}" width="7" height="${legH+footH}" rx="3" fill="${ch.outfit}"/>
    <rect x="${cx+1}" y="${hipY}" width="7" height="${legH+footH}" rx="3" fill="${ch.outfit}"/>
    <ellipse cx="${cx-5}" cy="${gy}" rx="6" ry="${footH/2}" fill="#1a0d2e"/>
    <ellipse cx="${cx+5}" cy="${gy}" rx="6" ry="${footH/2}" fill="#1a0d2e"/>
    <rect x="${cx-10}" y="${torsoY}" width="20" height="${torsoH+neckH}" rx="4" fill="${ch.outfit}"/>
    <line x1="${cx-10}" y1="${shoulderY}" x2="${cx-14}" y2="${handY}" stroke="${ch.outfit}" stroke-width="6" stroke-linecap="round"/>
    <line x1="${cx+10}" y1="${shoulderY}" x2="${cx+13}" y2="${handY}" stroke="#1a0d2e" stroke-width="6" stroke-linecap="round"/>
    <rect x="${cx-3}" y="${neckY}" width="6" height="${neckH+2}" fill="${ch.skin}"/>
    <ellipse cx="${cx}" cy="${headCY}" rx="${headR}" ry="${headR+1}" fill="${ch.skin}" stroke="#1a0d2e" stroke-width="1"/>
    ${hairSvg}
    <circle cx="${cx-4}" cy="${headCY+1}" r="1.7" fill="#fff"/>
    <circle cx="${cx+4}" cy="${headCY+1}" r="1.7" fill="#fff"/>
    <circle cx="${cx-3.5}" cy="${headCY+1.3}" r="1.05" fill="#1a0d2e"/>
    <circle cx="${cx+4.5}" cy="${headCY+1.3}" r="1.05" fill="#1a0d2e"/>
    <path d="M${cx-3},${headCY+6} Q${cx},${headCY+9} ${cx+3},${headCY+6}" fill="none" stroke="#1a0d2e" stroke-width="1" stroke-linecap="round"/>
    ${glSvg}
  </svg>`;
}

function confirmChar() {
  if (!state.selectedChar) return;
  document.getElementById('char-select').style.display='none';
  const g = document.getElementById('game');
  g.style.display='flex';
  g.style.flexDirection='column';
  renderScene(0);
}

// ============================================================
// SCENE RENDER
// ============================================================
function renderScene(id) {
  if(id===14){ const s=SCENES.find(x=>x.id===14); renderSceneData(s); return; }
  const s = SCENES.find(x=>x.id===id) || SCENES[0];
  renderSceneData(s);
}

function renderSceneData(s) {
  state.sceneId = s.id;
  state.history.push(s.id);

  document.getElementById('chapter-label').textContent = s.chapter;
  const pct = Math.min(100, Math.round((state.history.filter((v,i,a)=>a.indexOf(v)===i).length / TOTAL_SCENES)*100));
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-pct').textContent = pct+'%';

  // Build stage SVG
  const bgFn = BKGS[s.bg] || (()=>'');
  const npcs = SCENE_NPCS[s.id] || [];
  const pp = PLAYER_POS[s.id] || {cx:600,ground:200,facing:'left',hold:null,cls:'cr'};
  const playerChar = state.selectedChar || PLAYABLE[0];

  const npcsSvg = npcs.map(n => buildChar(NPCS[n.key], n.cx, n.ground, n.facing, n.hold, n.cls)).join('');
  const playerSvg = buildChar(playerChar, pp.cx, pp.ground, pp.facing, pp.hold, pp.cls);

  document.getElementById('scene-stage').innerHTML = `<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;">${bgFn()}${npcsSvg}${playerSvg}</svg>`;
  document.getElementById('loc-tag').textContent = s.location;

  // Speaker avatar
  const npcKey = SPEAKER_NPC[s.speaker];
  const spkCfg = npcKey ? NPCS[npcKey] : playerChar;
  const spkBg = npcKey ? (NPC_BG[npcKey]||'#1e1729') : '#1a0d2e';
  document.getElementById('spk-avatar').innerHTML = buildPortrait(spkCfg, spkBg);
  document.getElementById('spk-name').textContent = s.speaker;
  document.getElementById('dlg-text').textContent = '';
  typeText('dlg-text', s.dialogue);

  if(s.item)  addItem(s.item);
  if(s.item2) addItem(s.item2);
  renderItems();

  // Answer box
  const aa = document.getElementById('answer-area');
  aa.innerHTML = s.answer ? `<div class="answer-box"><div class="answer-label">📝 ${s.answer.label}</div><div class="answer-text">${s.answer.text}</div></div>` : '';

  // Chem fact
  const ca = document.getElementById('chem-area');
  ca.innerHTML = s.chemFact ? `<div class="chem-fact"><span class="chem-icon">${s.chemFact.icon}</span><div><div class="chem-label">🔬 ${s.chemFact.label}</div><div class="chem-text">${s.chemFact.text}</div></div></div>` : '';

  // Outcome
  const oa = document.getElementById('outcome-area');
  oa.innerHTML = s.outcome ? `<div class="outcome-flash ${s.outcome.type}">${s.outcome.text}</div>` : '';

  // Choices
  const qa = document.getElementById('choices-area');
  qa.innerHTML = '';
  if(s.isEnd){ renderEnd(s); return; }

  setTimeout(()=>{
    const box = document.createElement('div');
    box.className = 'choices-container';
    (s.choices||[]).forEach(ch=>{
      const btn = document.createElement('button');
      btn.className='choice-btn';
      btn.innerHTML=`<span class="choice-icon">${ch.icon}</span><div><div>${ch.text}</div><div class="choice-sub">${ch.sub||''}</div></div>`;
      btn.onclick=()=>{
        box.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
        btn.style.borderColor='var(--accent)';
        btn.style.background='rgba(192,132,252,0.2)';
        setTimeout(()=>renderScene(ch.next),450);
      };
      box.appendChild(btn);
    });
    qa.appendChild(box);
  },370);
}

function renderEnd(s) {
  const qa = document.getElementById('choices-area');
  qa.innerHTML = `<div class="end-screen">
    <div style="font-size:2.5rem;margin-bottom:0.8rem;">💗</div>
    <h2>You discovered the chemistry of love!</h2>
    <p>You followed the clues across the school and uncovered all three stages, the science behind why we fall in love.</p>
    <div class="end-facts">
      <div style="font-size:0.62rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent);font-weight:700;margin-bottom:0.6rem;">What You Learned</div>
      <div class="end-fact-item"><span class="dot">▸</span> Adrenaline = <strong>Epinephrine</strong>, the fight or flight hormone</div>
      <div class="end-fact-item"><span class="dot">▸</span> Stage 1, Biological Drive: <strong>Testosterone + Estrogen</strong> create initial attraction</div>
      <div class="end-fact-item"><span class="dot">▸</span> Stage 2, Attraction: <strong>Dopamine, Norepinephrine, decreased Serotonin</strong> + prefrontal cortex deactivation</div>
      <div class="end-fact-item"><span class="dot">▸</span> Reward Center: <strong>Central Tegmental Area</strong> flooded with excitement chemicals</div>
      <div class="end-fact-item"><span class="dot">▸</span> Stage 3, Attachment: <strong>Oxytocin + Vasopressin</strong> create long-term bond</div>
      <div class="end-fact-item"><span class="dot">▸</span> Adrenaline's role: turns abstract attraction into <strong>concrete physical emotions</strong></div>
      <div class="end-fact-item"><span class="dot">▸</span> Physical signs: <strong>sweaty palms, racing heart, butterflies, dilated pupils</strong></div>
    </div>
    <button class="reset-btn" onclick="resetGame()">↺ Play Again</button>
  </div>`;
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('progress-pct').textContent='100%';
}

function addItem(item) { if(!state.items.includes(item)) state.items.push(item); }
function renderItems() {
  document.getElementById('items-bar').innerHTML = state.items.map(i=>`<div class="item-badge">${i}</div>`).join('');
}
function typeText(elId, text) {
  const el=document.getElementById(elId);
  el.textContent='';
  let i=0;
  (function tick(){ if(i<text.length){ el.textContent+=text[i++]; setTimeout(tick,18); } })();
}
function resetGame() {
  state = { selectedChar:null, sceneId:0, items:[], history:[] };
  document.getElementById('items-bar').innerHTML='';
  document.getElementById('choices-area').innerHTML='';
  document.getElementById('answer-area').innerHTML='';
  document.getElementById('chem-area').innerHTML='';
  document.getElementById('outcome-area').innerHTML='';
  document.getElementById('game').style.display='none';
  const ts = document.getElementById('title-screen');
  ts.style.display='flex';
  ts.classList.remove('fade-out');
  ts.style.opacity='1';
}
</script>
</body>
</html>
